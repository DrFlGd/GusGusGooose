[package]
name = "gusgusgoose"
version = "0.1.0"
description = "Fit, dress and paint the Gus Gus desk goose, with a library of saved builds"
edition = "2021"
rust-version = "1.77"

[lib]
name = "gusgusgoose_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
